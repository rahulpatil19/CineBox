[versions]
agp = "8.13.2"
kotlin = "2.2.0"

compileSdk = "36"
minSdk = "28"
targetSdk = "36"

appcompat = "1.7.1"
material = "1.4.0"
recyclerview = "1.2.1"
cardview = "1.0.0"
vectordrawable = "1.1.0"
preference = "1.1.1"
volley = "1.2.1"

composeBom = "2026.06.01"
activityCompose = "1.13.0"
activity = "1.10.1"

fresco = "3.6.0"
okhttp = "5.3.2"

expandableText = "0.1.4"
circleIndicator = "1.2.2"
constraintLayout = "2.1.0"
swipeRefresh = "1.1.0"

shimmer = "0.5.0"
retrofit = "2.9.0"
lifecycle = "2.6.1"
firebaseBom = "33.7.0"
playAds = "24.9.0"
multidex = "2.0.1"
googleServices = "4.4.4"


[libraries]

androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-vectordrawable = { module = "androidx.vectordrawable:vectordrawable", version.ref = "vectordrawable" }
androidx-preference = { module = "androidx.preference:preference", version.ref = "preference" }

volley = { module = "com.android.volley:volley", version.ref = "volley" }

android-core-ktx = { module = "androidx.core:core-ktx" }

activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

fresco = { module = "com.facebook.fresco:fresco", version.ref = "fresco" }
fresco-okhttp = { module = "com.facebook.fresco:imagepipeline-okhttp3", version.ref = "fresco" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
expandable-text = { module = "com.ms-square:expandableTextView", version.ref = "expandableText" }
circle-indicator = { module = "me.relex:circleindicator", version.ref = "circleIndicator" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swipeRefresh" }
shimmer = { module = "com.facebook.shimmer:shimmer", version.ref = "shimmer" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playAds" }
multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }

[bundles]
compose = [
    "compose-ui",
    "compose-material3",
    "compose-ui-preview"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }