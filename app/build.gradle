import org.jetbrains.kotlin.gradle.dsl.JvmTarget
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
    alias(libs.plugins.compose.compiler)
}

android {
    compileSdkVersion libs.versions.compileSdk.get().toInteger()
    namespace "patil.rahul.cineboxtma"
    defaultConfig {
        applicationId "patil.rahul.cineboxtma"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 6
        versionName "1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true

        Properties properties = new Properties()
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
        def tmdbApikey = properties.getProperty('TMDB_API_KEY')

        buildConfigField "String", "TMDB_API_KEY", "${tmdbApikey}"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/YouTubeAndroidPlayerApi.jar')

    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.androidx.vectordrawable
    implementation libs.androidx.preference
    implementation libs.volley

    // Core KTX
    implementation libs.android.core.ktx

    // Compose
    implementation platform(libs.compose.bom)
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.ui.graphics
    androidTestImplementation platform(libs.compose.bom)

    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.compose.ui.preview
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.compose.ui.tooling

    implementation libs.activity.compose
    implementation libs.activity

    // Fresco
    implementation libs.fresco
    implementation libs.fresco.okhttp

    implementation libs.okhttp

    implementation libs.expandable.text
    implementation (libs.circle.indicator){
        artifact {
            type = "aar"
        }
    }
    implementation libs.constraintlayout
    implementation libs.swiperefreshlayout

    implementation libs.shimmer

    // Retrofit
    implementation libs.retrofit
    implementation libs.retrofit.gson

    // Lifecycle
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics

    // AdMob
    implementation libs.play.services.ads

    implementation project(':nativetemplates')

    implementation libs.multidex
    debugImplementation libs.androidx.ui.test.manifest
}